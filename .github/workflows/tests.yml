name: Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settings-filament-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: liberusoftware/.github/.github/workflows/package-tests.yml@main
    with:
      phpstan-level: 9
      coverage-threshold: 98
